name: Playtomic Court Monitor

on:
  schedule:
    # Restart hourly, 8am-11pm Madrid time (6am-9pm UTC)
    - cron: '0 6-21 * * *'
  workflow_dispatch: # Allow manual trigger

# Only allow one instance at a time
concurrency:
  group: playtomic-monitor
  cancel-in-progress: false

jobs:
  check-courts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      # Restore previous state so we can diff
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: |
            .playtomic_state.json
            .playtomic_matches_state.json
            .playtomic_radius_matches_state.json
            .playtomic_token.json
            .playtomic_counter
          key: playtomic-state-${{ github.run_id }}
          restore-keys: playtomic-state-

      - name: Check court availability (loop for 55 min)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          PLAYTOMIC_EMAIL: ${{ secrets.PLAYTOMIC_EMAIL }}
          PLAYTOMIC_PASSWORD: ${{ secrets.PLAYTOMIC_PASSWORD }}
          PLAYTOMIC_REFRESH_TOKEN: ${{ secrets.PLAYTOMIC_REFRESH_TOKEN }}
        run: |
          for i in $(seq 1 13); do
            echo "=== Check $i/13 ==="
            python playtomic_monitor.py once
            if [ $i -lt 13 ]; then
              echo "Sleeping 4 minutes..."
              sleep 240
            fi
          done
